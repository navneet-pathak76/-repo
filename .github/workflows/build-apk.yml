name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Generate app icon
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon.png
          file assets/icon.png

      - name: Generate Android project
        run: npx expo prebuild --clean

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
            cat > android/signing.env <<EOF
          ANDROID_KEYSTORE_PASSWORD='$ANDROID_KEYSTORE_PASSWORD'
          ANDROID_KEY_ALIAS='$ANDROID_KEY_ALIAS'
          ANDROID_KEY_PASSWORD='$ANDROID_KEY_PASSWORD'
          EOF
            echo "Using the configured persistent release keystore."
          else
            echo "Release signing secrets are not configured; generating a CI-only release keystore."
            CI_KEYSTORE_PASSWORD="CI-RPExchange-2026"
            CI_KEY_ALIAS="rp-exchange-ci"
            keytool -genkeypair -v               -keystore android/release.keystore               -storetype PKCS12               -storepass "$CI_KEYSTORE_PASSWORD"               -keypass "$CI_KEYSTORE_PASSWORD"               -alias "$CI_KEY_ALIAS"               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=RP Exchange, OU=CI, O=RP Exchange, L=Kolkata, ST=West Bengal, C=IN"
            cat > android/signing.env <<EOF
          ANDROID_KEYSTORE_PASSWORD='$CI_KEYSTORE_PASSWORD'
          ANDROID_KEY_ALIAS='$CI_KEY_ALIAS'
          ANDROID_KEY_PASSWORD='$CI_KEYSTORE_PASSWORD'
          EOF
          fi
          test -s android/release.keystore
          test -s android/signing.env

      - name: Build signed release APK
        working-directory: android
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_ADMIN_UID: ${{ secrets.EXPO_PUBLIC_FIREBASE_ADMIN_UID }}
        run: |
          set -e
          set -a
          source signing.env
          set +a
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RP-Exchange-APK-Signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Clean signing material
        if: always()
        run: rm -f android/release.keystore
